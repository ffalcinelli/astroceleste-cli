[package]
name = "astroceleste"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ffalcinelli/astroceleste-cli"
homepage = "https://astroceleste.it"
documentation = "https://docs.rs/astroceleste"
description = "Command-line interface for the Astroceleste astrological calculations"
readme = "README.md"
keywords = ["astrology", "cli", "ephemeris", "astronomy"]
