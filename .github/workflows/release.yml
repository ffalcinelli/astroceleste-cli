name: Release

# Trunk-based: pushing a `vX.Y.Z` tag on a commit of `main` publishes that version. The tag
# must match the workspace version in Cargo.toml and CHANGELOG.md must have a `## [X.Y.Z]`
# section (both prepared in a `chore: release` commit, e.g. with `release-plz update`).
# The `release` job publishes the crate to crates.io and creates the GitHub Release.
# crates.io uses Trusted Publishing (OIDC): no long-lived tokens. crates.io can only
# trust a workflow for a package that already exists, so the very first release falls back
# to short-lived secrets (CARGO_REGISTRY_TOKEN in the `crates-io` environment), deleted once
# trusted publishing is set up.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: test the tagged commit
    if: github.repository_owner == 'ffalcinelli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo test --release

  release:
    name: publish
    needs: verify
    if: github.repository_owner == 'ffalcinelli'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: check tag, version and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "astroceleste") | .version')
          [ "$TAG" = "v$version" ] \
            || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          # Release notes: the body of the `## [X.Y.Z]` section, up to the next section.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        # Fails until trusted publishing is configured (first release): use the secret.
        continue-on-error: true
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p astroceleste
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
